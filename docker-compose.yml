services:
  rainfall-api:
    build: .
    image: rainfall-partition-api:1.0.0
    container_name: rainfall-api
    ports:
      - "8000:8000"
    environment:
      RAIN_DATA_DIR: /data
      # Extra seconds held at every pipeline gate so pause / kill demos are
      # observable. Set to 0 for real-speed processing.
      RAIN_DEMO_DELAY: "2"
    volumes:
      - rainfall-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rainfall-data:
